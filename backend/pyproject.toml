# Tooling configuration for the IntelliClaim AI backend.
# Runtime dependencies live in requirements.txt; dev tools in requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "tesseract: needs the tesseract OCR binary (skipped when it is not installed)",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "seed_data.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters through default values such as File(...) and Depends().
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "main", "middleware", "models", "routers", "security", "services", "utils"]
