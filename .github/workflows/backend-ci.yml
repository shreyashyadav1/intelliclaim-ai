name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_MONGODB_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest with coverage)
        run: >-
          pytest
          --cov
          --cov-report=term-missing:skip-covered
          --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  evals:
    name: Offline evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The risk suite's duplicate check uses a throwaway database here.
      EVAL_MONGODB_URI: mongodb://localhost:27017
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed
          key: fastembed-BAAI-bge-small-en-v1.5

      # No API keys: the extraction and rag-answer suites are not part of CI.
      - name: Run offline evals (retrieval, OCR, classification, risk)
        run: python -m evals.run --suite offline --check-thresholds --output-dir "$RUNNER_TEMP/evals"

      - name: Add the eval summary to the job page
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evals/summary.md" ]; then
            cat "$RUNNER_TEMP/evals/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: ${{ runner.temp }}/evals/
          if-no-files-found: warn
