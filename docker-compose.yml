services:
  mongodb:
    image: mongo:7.0
    container_name: intelliclaim-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: intelliclaim
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # The same image Railway builds.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelliclaim-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides .env: inside compose the database is the mongodb service.
      MONGODB_URI: mongodb://mongodb:27017
      # Clients connect directly, so X-Forwarded-For must not be trusted.
      TRUSTED_PROXY_COUNT: "0"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_data
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelliclaim-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongodb_data:
  uploads_data:
  chroma_data:
